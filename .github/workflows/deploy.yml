name: Deploy

# Deploys this repo to your Cloudflare account. Run it from the Actions tab
# ("Deploy" → "Run workflow"). It needs three repository secrets
# (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with Workers Scripts, D1 and Vectorize edit rights
#   CLOUDFLARE_ACCOUNT_ID  your account id, from the dashboard's Workers & Pages page
#   APP_SECRET             32+ random characters; it's also your setup code, so keep a copy
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_SECRET: ${{ secrets.APP_SECRET }}
      # Must match index_name in wrangler.jsonc.
      VECTORIZE_INDEX: sermon-research
    steps:
      - name: Check the secrets are set
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Add the $name repository secret."; missing=1; fi
          done
          if [ -n "$APP_SECRET" ] && [ "${#APP_SECRET}" -lt 32 ]; then echo "::error::APP_SECRET must be at least 32 characters."; missing=1; fi
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Create the search index if it's missing
        run: |
          if npx wrangler vectorize get "$VECTORIZE_INDEX" > /dev/null 2>&1; then
            echo "Search index $VECTORIZE_INDEX already exists."
          else
            npx wrangler vectorize create "$VECTORIZE_INDEX" --dimensions=1536 --metric=cosine
          fi
          if npx wrangler vectorize list-metadata-index "$VECTORIZE_INDEX" 2>/dev/null | grep -q episodeId; then
            echo "episodeId metadata index already exists."
          else
            npx wrangler vectorize create-metadata-index "$VECTORIZE_INDEX" --property-name=episodeId --type=string
          fi
      - name: Deploy the Worker
        run: npx wrangler deploy
      - name: Set APP_SECRET
        run: printf '%s' "$APP_SECRET" | npx wrangler secret put APP_SECRET
